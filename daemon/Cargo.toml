[package]
name = "rfd"
version = "0.1.0"
edition = "2021"
description = "RootCrack userspace daemon: module manager, su broker, KPM control"
license = "GPL-3.0-or-later"

[[bin]]
name = "rfd"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
libc = "0.2"
nix = { version = "0.29", features = ["user", "process", "fs", "mount"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
log = "0.4"
android_logger = "0.14"
walkdir = "2.5"
env_logger = "0.11"

[profile.release]
lto = true
opt-level = 3
panic = "abort"
strip = true
